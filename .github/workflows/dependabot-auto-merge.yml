name: Dependabot Auto-merge

# Dev-dependency updates (grouped into one PR by dependabot.yml) merge
# themselves once dependency resolution succeeds. Runtime, actions, and
# docker updates never match the merge condition and stay for manual review.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify dependency resolution (dry run)
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements-dev.txt

      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Merge dev-only updates
        # Merge only when every updated dependency is dev-type; any runtime
        # dependency in the PR keeps it on the manual review path. Direct
        # squash-merge (not --auto): this job's resolution check above is
        # the only gate, so no repo-level auto-merge setting is needed.
        if: ${{ !contains(steps.metadata.outputs.dependency-type, 'production') && contains(steps.metadata.outputs.dependency-type, 'development') }}
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# GitHub Dependabot Configuration
# Automatically create pull requests to update dependencies

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # allure-pytest 2.13.5 pins allure-python-commons==2.13.5 exactly;
      # bumping commons alone makes pip resolution impossible.
      # Re-evaluate when allure-pytest ships a matching release.
      - dependency-name: "allure-python-commons"
      # pytest-env >=1.6.0 requires pytest>=9.0.2; project pins pytest 8.3.4.
      # Re-evaluate when the project migrates to pytest 9.
      - dependency-name: "pytest-env"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
    ignore:
      # tensorflow (2.20/2.21) and opencv-python (4.11) ship no cp314 wheels;
      # python:3.14-slim breaks the docker build. Re-evaluate when wheels exist.
      - dependency-name: "python"

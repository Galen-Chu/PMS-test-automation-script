# GitHub Dependabot Configuration
# Automatically create pull requests to update dependencies
#
# Strategy (2026-09-08):
#   - Checks run monthly (1st of each month, 06:00 UTC).
#   - Dev dependencies (requirements-dev.txt) arrive as ONE grouped PR and
#     are auto-merged by .github/workflows/dependabot-auto-merge.yml.
#   - Runtime dependencies stay individual PRs for manual review.
#   - To pause updates entirely, remove this file.

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    groups:
      # All dev-tool bumps (pylint, black, faker, ipython, ...) in one PR
      development-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # allure-pytest and allure-python-commons pin each other exactly;
      # commons-only bumps are unmergeable. Bump allure-pytest and pin
      # commons to the matching version in the same change instead.
      - dependency-name: "allure-python-commons"
      # numpy >=2.5 requires Python >=3.12; the CI matrix still tests 3.11.
      # Re-evaluate when the 3.11 matrix entry is dropped.
      - dependency-name: "numpy"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Galen-Chu"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
    ignore:
      # tensorflow (2.20/2.21) and opencv-python (4.11) ship no cp314 wheels;
      # python:3.14-slim breaks the docker build. Re-evaluate when wheels exist.
      - dependency-name: "python"
